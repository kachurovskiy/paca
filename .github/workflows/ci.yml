name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build standalone application
        run: npm run build

      - name: Verify committed Pages build is current
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::Run npm run build and commit the updated docs/ files."
            exit 1
          fi

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run mocked browser tests
        run: npm run test:e2e
